name: Deploy to GitHub Pages

on:
  # Deploy on every push to main.
  push:
    branches: [main]
  # ...and allow manual runs from the Actions tab.
  workflow_dispatch:

# Grant the tokens the Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress publish.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        # next/font downloads the Google Fonts at build time, and a dropped
        # download fails the whole build as "module not found" on a font CSS
        # file. Retry so one network blip doesn't block a deploy; a real build
        # error fails all three attempts and still stops the job.
        run: |
          for attempt in 1 2 3; do
            npm run build && exit 0
            echo "::warning::Build attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          exit 1
        env:
          # Optional: set these as repo variables/secrets to enable Cloudinary
          # image delivery. Unset simply serves image srcs as-authored.
          CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
          # Search-engine ownership verification. Unset until the tokens are
          # added under Settings › Secrets and variables › Actions › Variables;
          # the meta tags are omitted rather than rendered empty until then.
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_BING_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_BING_SITE_VERIFICATION }}
          # Lab › rec: where replay URLs point. Unset uses the default Vercel
          # deployment (rec-mock-llm-response-recorder.vercel.app).
          NEXT_PUBLIC_REC_REPLAY_ORIGIN: ${{ vars.NEXT_PUBLIC_REC_REPLAY_ORIGIN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # `output: 'export'` writes the static site here.
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # TEMPORARY: GitHub Pages kept deployment 02ba776 "in progress" after run
      # 73 cancelled it, and refuses every new deploy until it is cancelled.
      # Remove this step once a deploy has gone through.
      - name: Cancel stuck Pages deployment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/deployments/02ba776e61e475fe5eab2110e72a87ae20718d08/cancel" \
            -w "\nHTTP %{http_code}\n"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
